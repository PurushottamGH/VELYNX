name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  BENCHMARK_SEED: "42"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      # Scoped to the released surface: the `velynx` wheel (framework, validation,
      # experiments, scripts, tests) plus the `p1-os` distribution under p1/tooling.
      # `backend/` is excluded pending its disposition (W-008) — it accounts for 261
      # of the 457 unformatted files and is not part of any shipped distribution.
      # `archive/` is a frozen vault. A full-repository pass is tracked in
      # CRITICAL_PATH.md Priority 2.
      - name: Check formatting with black
        run: black --check --diff framework/ validation/ experiments/ scripts/ tests/ p1/tooling/
      # Advisory under Constitution S12p3 (SHOULD). `continue-on-error` marks the
      # step as failed without failing the job, so an unassessed criterion is not
      # reported as passed (S12p1). `|| true` would report it as passed.
      - name: Type check with mypy (advisory)
        continue-on-error: true
        run: mypy --ignore-missing-imports framework/ p1/tooling/p1_os/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
      # No suppressed exit codes: a failing test suite fails the job (S12p1).
      # Coverage targets are packages that exist in the tree; `core/` and
      # `validation/` do not, and naming them produced a check that could not
      # assess what it claimed to assess.
      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --cov=framework --cov-report=term --cov-report=xml -m "not slow"
      - name: Run research tests
        run: |
          python -m pytest research/tests/ -v --cov=research --cov-report=term --cov-report=xml -m "not slow"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          pip install -r requirements.txt
      - name: Verify reproducibility spec
        run: python scripts/verify_reproducibility.py

  experiment-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          pip install -r requirements.txt
      - name: Validate experiment registry
        run: python scripts/validate_experiment_registry.py
      - name: Validate parameter registry consistency
        run: python scripts/validate_parameter_registry.py

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml numpy
          pip install -r requirements.txt
      - name: Run benchmark smoke test
        run: python scripts/smoke_benchmark.py

  kill-criteria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml numpy
          pip install -r requirements.txt
      - name: Check kill criteria
        run: python scripts/check_kill_criteria.py

  artifact-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Verify artifact integrity
        run: python scripts/verify_artifact_integrity.py
