# M1 baseline — the base configuration every validation sweep overrides.
#
# Differences from m0_replication.yaml, and why:
#
#   environment: markov_blocks_split
#       Task generation, stream trajectory and task order draw from independent
#       seed substreams. Required by V0-4: with M0's single composite seed, one
#       variance source can dominate a contrast invisibly.
#
#   seeds.mode: independent
#       Environment, trajectory, replay, probe and order seeds are derived
#       separately from the master seed, so each can be pinned or varied alone.
#
#   metrics
#       excess_loss (primary outcome family) and plasticity (guardrail) are
#       always on. `retention` is retained only for comparability with M0 and is
#       marked ineligible as a primary outcome in its own output.
#
# This file is a starting point, not a protocol. SESOIs, equivalence margins,
# seed counts and stopping rules are scientific parameters and are NOT set here:
# they belong in a preregistration signed off before confirmatory runs, as the
# M0 review requires. Running this config produces exploratory data only.

config_version: 1
name: v0_baseline
description: "M1 base configuration: split seeds, excess-loss primary, plasticity guardrail"

benchmark:
  name: markov_retention
  params:
    probe_pairs: 500

environment:
  name: markov_blocks_split
  params:
    n_tasks: 4
    alphabet: 8
    steps_per_task: 2000
    cycles: 1
    fanout: 2
    order: sequential

model:
  name: count_model
  params:
    alpha: 0.5
    decay: 0.99

memory:
  name: reservoir
  params:
    capacity: 1000

gate:
  name: surprise
  params:
    threshold: 1.5
    k: 4

replay:
  name: buffer_sample
  params:
    weight: 1.0

metrics:
  - name: online_loss
    params:
      tail: 500
  - name: retention
  - name: excess_loss
  - name: plasticity
    params:
      window: 200
  - name: compute
  - name: gate_activity
    params:
      boundary_window: 50

seeds:
  master: 0
  mode: independent
  overrides: {}

compute:
  max_steps: null
  max_updates: null
  max_wall_seconds: null

logging:
  level: info
  console: false
  step_format: csv
  plots: true
