[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velynx"
version = "0.1.0"
description = "Predictive Processing Cognitive Architecture"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Program D Team"},
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = [
    "framework*",
    "validation*",
    "experiments*",
    "tests*",
    "scripts*",
    "v2*",
]
exclude = ["archive*", "backend*", "data*", "docs*"]

[tool.pytest.ini_options]
# `p1/tooling` is the package root of the editable-installed `p1-os`
# distribution. It must be on sys.path, not merely reachable through the
# editable install's meta-path finder: setuptools appends that finder
# *after* `PathFinder`, so `PathFinder` wins any name race. A whole-repo
# pytest session puts `tests/` on sys.path (its `unit`/`integration`/
# `validation`/`fixtures` subdirectories are packages while `tests/`
# itself is not), and the bare directory `tests/p1_os/` then resolves as
# a namespace package named `p1_os` before the finder is ever consulted.
# Listing the real package root here makes `p1/tooling/p1_os/__init__.py`
# a regular package on sys.path, which deterministically beats a
# namespace portion regardless of sys.path order.
pythonpath = [
    ".",
    "p1/tooling",
    "archive/program_a",
    "archive/program_b",
    "archive/program_c",
]
testpaths = [
    "tests",
    "research/tests",
    "experiments",
]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "smoke: marks tests as smoke tests",
]

[tool.coverage.run]
source = ["framework", "experiments", "tests", "scripts", "v2"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
