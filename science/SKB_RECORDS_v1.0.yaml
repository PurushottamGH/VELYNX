assumptions:
  - id: ASM-2026-0001
    statement: "Decay-induced degradation in P1 v0 is an informative proxy for continual-learning interference rather than only an artifact of the erasure rule."
    category: model
    status: Active_Unvalidated
    needed_by: [HYP-2026-0007, HYP-2026-0008, EXP-2026-0007]
    consequence_if_false: "Replay findings would be confined to correcting an artificial decay process."
    smallest_test: "Paired decay=0.99 versus decay=1.0 assay validation with oracle excess loss."

  - id: ASM-2026-0002
    statement: "Final-minus-post-learning probe loss is a valid measure of forgetting when initial mastery and current-task plasticity are reported jointly."
    category: measurement
    status: Active_Unvalidated
    needed_by: [HYP-2026-0007, HYP-2026-0008]
    consequence_if_false: "A condition can appear to forget less because it learned less initially."
    smallest_test: "Compare conclusions under final excess loss, backward transfer, initial mastery, and joint stability-plasticity metrics."

  - id: ASM-2026-0003
    statement: "Independent environment seeds are the appropriate primary experimental units for P1 v0 contrasts."
    category: statistical
    status: Active_Unvalidated
    needed_by: [EXP-2026-0007]
    consequence_if_false: "Inference may understate variance or target the wrong population."
    smallest_test: "Variance decomposition over environment, trajectory, replay, probe, and order seeds."

  - id: ASM-2026-0004
    legacy_ids: [I1]
    statement: "Prediction error is sufficient to drive representational structure in the E0 learner."
    category: causal
    status: Active_Unvalidated
    needed_by: [HYP-2026-0001]
    consequence_if_false: "The proposed growth signal cannot produce the target structure."
    smallest_test: "An E0 execution in which the growth intervention demonstrably activates and is compared to decoupled growth."

  - id: ASM-2026-0005
    legacy_ids: [I2]
    statement: "Learned structure can be operationally distinguished from injected or statistically trivial structure."
    category: measurement
    status: Contradicted
    needed_by: [HYP-2026-0001]
    consequence_if_false: "Emergence claims are non-identifiable."
    evidence_against: [EVD-2026-0008]
    smallest_test: "Null-referenced shuffled-input emergence statistic with injection-matched controls."

  - id: ASM-2026-0006
    legacy_ids: [I3]
    statement: "A feasible environment can require nontrivial structure without being hand-seeded or linearly trivial."
    category: world
    status: Active_Unvalidated
    needed_by: [HYP-2026-0001]
    consequence_if_false: "E0 becomes vacuous or infeasible."
    smallest_test: "Offline environment challenge showing fixed/linear controls cannot recover the latent while an oracle can."

  - id: ASM-2026-0007
    statement: "The adjudicated query distribution used for calibration represents the intended Program A use scope."
    category: data
    status: Active_Unvalidated
    needed_by: [HYP-2026-0002, EXP-2026-0005]
    consequence_if_false: "Calibration estimates will not transfer to deployment queries."
    smallest_test: "Predefine deployment strata and test calibration stability across them."

  - id: ASM-2026-0008
    statement: "Affective categories and task schemas can be evaluated without circularly authoring the task set around those categories."
    category: human_judgment
    status: Active_Unvalidated
    needed_by: [HYP-2026-0003, EXP-2026-0006]
    consequence_if_false: "Any observed advantage may be designer alignment rather than reusable indexing."
    smallest_test: "Use third-party tasks frozen independently of the affect mapping."

  - id: ASM-2026-0009
    statement: "The PH-1 environment contains no current-input leakage and the historical cue is feasible to retain within the declared memory budget."
    category: world
    status: Active_Unvalidated
    needed_by: [HYP-2026-0009, EXP-2026-0009]
    consequence_if_false: "The carrier-ablation experiment cannot distinguish memory from leakage or infeasibility."
    smallest_test: "Analytic memoryless ceiling plus oracle, carrier-ablation, and shuffled controls."

  - id: ASM-2026-0010
    statement: "A run executed from a clean, committed revision can be reconstructed from the recorded code, configuration, runtime, seeds, and artifacts without unrecorded local state affecting the scientific outputs."
    category: reproducibility
    status: Active_Unvalidated
    needed_by: [EXP-2026-0007]
    consequence_if_false: "A nominally clean manifest would not establish reconstructable confirmatory evidence or stable variance estimates."
    smallest_test: "Two isolated fresh-checkout executions of the same frozen config and seed must produce identical decision-relevant metrics and artifact hashes, with declared exceptions only for nondeterministic metadata."

  - id: ASM-2026-0011
    statement: "Repository and CI gates exercise the same platform, configs, execution path, and artifact layout used to generate scientific evidence, and fail when those surfaces are absent or invalid."
    category: measurement
    status: Contradicted
    needed_by: [EXP-2026-0007]
    consequence_if_false: "Green automation supplies no assurance about the apparatus that generated the evidence."
    evidence_against: [EVD-2026-0009]
    smallest_test: "Run all required platform, equivalence, config-to-artifact, provenance, and integrity gates in a fresh checkout and inject one known failure into each gate to demonstrate sensitivity."

unknowns:
  - id: UNK-2026-0001
    title: Resource-matched replay effect
    statement: "Whether historical replay improves prior-task excess loss after matching update count, decay applications, compute, and immediate-sample exposure."
    type: nonidentifiability
    status: Prioritized
    affects: [HYP-2026-0007, MEC-2026-0006]
    resolution_criterion: "A preregistered paired contrast meets the replay SESOI and plasticity guardrail on untouched confirmation seeds."
    smallest_discriminating_experiment: "EXP-2026-0007 resource-matched replay contrast."
    information_gain: {D: 4, U: 4, B: 4, R: 4, F: 3, C: 2, priority: 256, rationale: "Central causal replay claim; feasible with current rig after controls are exposed."}

  - id: UNK-2026-0002
    title: Information in surprise timing
    statement: "Whether loss-triggered timing contains useful allocation information beyond replay budget and task-boundary correlation."
    type: nonidentifiability
    status: Prioritized
    affects: [HYP-2026-0008, MEC-2026-0007]
    resolution_criterion: "Surprise exceeds equal-budget random timing by a preregistered SESOI without violating plasticity guardrails on confirmation seeds."
