skb:
  name: Project P1 Scientific Knowledge Base
  version: "1.1.0"
  state_date: "2026-07-28"
  phase: Discovery
  authority: P1_SOS_Chief_Scientist
  correction_policy: "Decision-bearing records are append-only and corrected by linked supersession."
  migration_note: "Legacy labels are preserved as provenance, not inherited as present scientific status."

hypotheses:
  - id: HYP-2026-0001
    legacy_ids: ["H*"]
    title: Error-gated structure acquisition
    statement: "Within a specified nonlinear-latent stream, a learner using prediction error to gate capacity growth acquires structure absent at initialization, improves held-out prediction over fixed-capacity and capacity-matched error-decoupled controls, and exceeds a shuffled-input emergence reference."
    scope: "The E0 environment and closely matched descendants; no general intelligence claim."
    phase: Discovery
    status: Exploratory
    evidence_for: []
    evidence_against: []
    unresolved_evidence: [EVD-2026-0005]
    experiments: [EXP-2026-0004]
    assumptions: [ASM-2026-0004, ASM-2026-0005, ASM-2026-0006]
    unknowns: [UNK-2026-0005]
    confidence: {effect: very_low, mechanism: very_low, generalization: very_low}
    rationale: "E0 executed but its growth intervention never activated; H* was therefore not tested."

  - id: HYP-2026-0002
    legacy_ids: ["H1"]
    title: Retrieval uncertainty calibration
    statement: "Within a defined query distribution, a retrieval agent can emit confidence tiers whose empirical correctness is calibrated, with preregistered ECE and hallucination-honesty criteria."
    scope: "Program A retrieval outputs on a frozen, adjudicated query set."
    phase: Discovery
    status: Exploratory
    evidence_for: []
    evidence_against: [EVD-2026-0004]
    unresolved_evidence: []
    experiments: [EXP-2026-0005, EXP-2026-0008]
    assumptions: [ASM-2026-0007]
    unknowns: [UNK-2026-0006]
    confidence: {effect: low, mechanism: very_low, generalization: very_low}
    rationale: "One historical CERTAIN-on-fabrication observation directly opposes the calibration claim for the tested legacy system; the broader achievable-system hypothesis remains testable."

  - id: HYP-2026-0003
    legacy_ids: ["H2"]
    title: Affective indexing
    statement: "A learned affective-framing-to-problem-solving-schema mapping improves objective task outcomes over an otherwise identical neutral framing on third-party tasks not authored around the affect categories."
    scope: "Prompt-level framing and objective task outcomes under a preregistered external task set."
    phase: Discovery
    status: Proposed
    evidence_for: []
    evidence_against: []
    unresolved_evidence: []
    experiments: [EXP-2026-0006]
    assumptions: [ASM-2026-0008]
    unknowns: [UNK-2026-0007]
    confidence: {effect: very_low, mechanism: very_low, generalization: very_low}

  - id: HYP-2026-0004
    legacy_ids: ["H3"]
    title: Emergent development without injection clause
    statement: "Persistent prediction error plus capacity growth produces reusable structure absent at initialization."
    scope: "Historical weaker formulation."
    phase: Discovery
    status: Superseded
    superseded_by: HYP-2026-0001
    evidence_for: []
    evidence_against: []
    rationale: "The weaker claim omits the decisive injected-versus-learned discrimination and is subsumed by HYP-2026-0001."

  - id: HYP-2026-0005
    legacy_ids: ["C8 free-energy benefit claim"]
    title: Free-energy consolidation advantage
    statement: "The tested legacy FreeEnergyPolicy improves PredictionRMSE over the null consolidation policy in the R1 environment family."
    scope: "R1 C7 Sensorium environment, horizons 50/200, noise 0.01/0.15, seeds 1-3, 700 ticks."
    phase: Discovery
    status: Rejected
    evidence_for: []
    evidence_against: [EVD-2026-0001]
    experiments: [EXP-2026-0001]
    confidence: {effect: high, mechanism: low, generalization: very_low}
    rationale: "R1 found a treatment-minus-null PredictionRMSE difference of +0.0040 with p=0.8660 and a 95% CI spanning substantial benefit and harm. Rejection is scoped to the tested policy and environment, not all free-energy formulations."

  - id: HYP-2026-0006
    legacy_ids: ["old semantic-understanding headline"]
    title: Keyword benchmark demonstrates semantic understanding
    statement: "High performance on the legacy exact-keyword concept benchmark persists under keyword-free paraphrase and therefore exceeds exact lexical lookup."
    scope: "The 32-concept legacy Tier-2 detector tested by EXP-0."
    phase: Discovery
    status: Rejected
    evidence_for: []
    evidence_against: [EVD-2026-0002]
    experiments: [EXP-2026-0002]
    confidence: {effect: very_high, mechanism: high, generalization: low}
    rationale: "Tier-2 hit rate fell from 32/32 on originals to 0/32 on keyword-free paraphrases. This rejects the benchmark inference, not every possible semantic capability."

  - id: HYP-2026-0007
    legacy_ids: ["P1 v0 replay effect"]
    title: Resource-matched historical replay benefit
    statement: "Historical replay reduces final prior-task excess predictive loss compared with no historical replay when total learning updates and decay applications are matched, without exceeding a preregistered plasticity cost."
    scope: "P1 v0 sparse first-order Markov task family until extended by validation."
    phase: Discovery
    status: Exploratory
    evidence_for: [EVD-2026-0006]
    evidence_against: []
    unresolved_evidence: [EVD-2026-0007]
    experiments: [EXP-2026-0007]
    assumptions: [ASM-2026-0001, ASM-2026-0002, ASM-2026-0003]
    unknowns: [UNK-2026-0001, UNK-2026-0003]
    confidence: {effect: low, mechanism: very_low, generalization: very_low}

  - id: HYP-2026-0008
    legacy_ids: ["P1 v0 surprise allocation"]
    title: Surprise-triggered replay allocation advantage
    statement: "At an identical realized replay budget and batch-size profile, loss-triggered replay improves a preregistered joint retention-plasticity outcome over replay times sampled independently of loss."
    scope: "P1 v0 sparse first-order Markov task family until extended by validation."
    phase: Discovery
    status: Exploratory
    evidence_for: []
    evidence_against: []
    unresolved_evidence: [EVD-2026-0007]
    experiments: [EXP-2026-0007]
    assumptions: [ASM-2026-0001, ASM-2026-0002, ASM-2026-0003]
    unknowns: [UNK-2026-0002, UNK-2026-0003]
    confidence: {effect: very_low, mechanism: very_low, generalization: very_low}

  - id: HYP-2026-0009
    legacy_ids: ["T-01 memory-carrying reading"]
    title: Historical-carrier dependence in temporally aliased decisions
    statement: "Competent behavior on temporally aliased decisions requires retaining a task-relevant distinction across time; erasing the historical carrier removes the advantage over a compute-matched memoryless policy."
    scope: "The preregistered PH-1 temporal-aliasing instrument."
    phase: Discovery
    status: Proposed
    evidence_for: []
    evidence_against: []
    experiments: [EXP-2026-0009]
    assumptions: [ASM-2026-0009]
    unknowns: [UNK-2026-0008]
    confidence: {effect: very_low, mechanism: very_low, generalization: very_low}

  - id: HYP-2026-0010
    legacy_ids: ["T-02"]
    title: Stateful conditional transduction schema
    statement: "Interactive competence should be represented as a non-anticipating causal policy kernel evaluated jointly with an environment process."
    scope: "Measurement and specification ontology."
    phase: Discovery
    status: Archived
    evidence_for: []
    evidence_against: []
    rationale: "The proposition makes no risky prediction distinct from HYP-2026-0009 and is retained as a design constraint, not as a scientific hypothesis."

experiments:
  - id: EXP-2026-0001
    legacy_ids: [R1]
    title: Free-energy consolidation policy ablation
    phase: Discovery
    status: Closed
    question: "Does the tested FreeEnergyPolicy improve measurable outcomes over simpler consolidation policies?"
    hypotheses: [HYP-2026-0005]
    conditions: [null, random, fifo, similarity, utility, free_energy]
    design: "72 runs: 6 policies x 2 replay horizons x 2 noise levels x 3 seeds; 700 ticks."
    primary_metrics: [PredictionRMSE]
    unavailable_primary_metrics: [HeldOutPredictiveLogLikelihood, RareEventRecall, KnowledgeRetentionScore, GeneralizationScore, TransferScore]
    executions: [EXP-2026-0001-R0001]
    observations: [OBS-2026-0001, OBS-2026-0002]
    evidence: [EVD-2026-0001]
    validity: valid_negative
    limitations: ["Only one of six declared primary metrics was measurable", "single environment family", "three seeds per cell", "commit-frequency differences between policies"]

  - id: EXP-2026-0002
    legacy_ids: [EXP-0]
    title: Exact-keyword versus keyword-free paraphrase test
    phase: Discovery
    status: Closed
    question: "Does legacy concept detection persist when exact seeded keywords are removed by paraphrase?"
    hypotheses: [HYP-2026-0006]
    design: "32 paired original/paraphrase items; Tier-2 legacy and Tier-1 v2; McNemar exact test; 10,000-iteration paired bootstrap."
    executions: [EXP-2026-0002-R0001, EXP-2026-0002-R0002]
    observations: [OBS-2026-0003, OBS-2026-0004]
    evidence: [EVD-2026-0002, EVD-2026-0003]
    validity: valid_negative
    limitations: ["One 32-item concept set", "tests detector behavior rather than broad semantic competence", "both artifact directories contain the same reported summary"]

  - id: EXP-2026-0003
    legacy_ids: [M0]
    title: P1 v0 seed-0 replay demonstration
    phase: Discovery
    status: Interpreted
    question: "Can the v0 rig deterministically produce measurable prior-task degradation and replay-associated contrasts?"
    hypotheses: [HYP-2026-0007, HYP-2026-0008]
    design: "One default seed-0 run for online, replay_always, and replay_surprise; nine implementation tests."
    executions: [EXP-2026-0003-R0001]
    observations: [OBS-2026-0008, OBS-2026-0009, OBS-2026-0010]
    evidence: [EVD-2026-0006, EVD-2026-0007]
    validity: valid_indeterminate
    limitations: ["one environment seed", "unmatched replay budgets", "unmatched update and decay counts", "current observation stored before replay", "metric construct weakness", "uncommitted reviewed code and nonmatching stored artifact", "the successor M1 apparatus remains uncommitted and therefore cannot yet close immutable-provenance debt"]

