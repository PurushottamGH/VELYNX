framework:
  name: Project P1 Scientific Infrastructure
  version: "1.0.0"
  id_policy: "TYPE-YYYY-NNNN; permanent; never reused"
  time_format: "ISO 8601 with timezone"
  correction_policy: "append successor; never overwrite decision-bearing records"

controlled_vocabularies:
  phase: [Discovery, Validation, Publication]
  hypothesis_status: [Proposed, Exploratory, Under_Validation, Validated, Rejected, Superseded, Archived]
  experiment_status: [Proposed, Designed, Ready, Running, Completed, Interpreted, Closed, Withdrawn, Abandoned, Superseded]
  result_validity: [valid_positive, valid_negative, valid_indeterminate, invalid, abandoned]
  assumption_status: [Proposed, Active_Unvalidated, Under_Test, Supported, Contradicted, Retired, Replaced, Superseded]
  uncertainty_status: [Open, Prioritized, Under_Investigation, Reduced, Resolved, Reopened, Deferred, Archived]
  theory_status: [Candidate, Provisional, Under_Test, Supported, Challenged, Rejected, Revised, Superseded, Archived]
  decision_action: [Accept, Reject, Revise, Split, Merge, Archive, Supersede, No_Verdict]
  confidence_level: [very_low, low, moderate, high, very_high]
  debt_severity: [Low, Moderate, High, Critical]
  debt_block: [B0, B1, B2, B3, B4]

